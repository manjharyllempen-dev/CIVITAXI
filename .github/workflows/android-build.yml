name: Build CiviTaxi APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build three debug APKs
        run: gradle :app:assembleUsuarioDebug :app:assembleChoferDebug :app:assembleAdminDebug
      - name: Prepare easy-to-share APK names
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/usuario/debug/*.apk dist/CiviTaxi-Usuario.apk
          cp app/build/outputs/apk/chofer/debug/*.apk dist/CiviTaxi-Chofer.apk
          cp app/build/outputs/apk/admin/debug/*.apk dist/CiviTaxi-Administrador.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CiviTaxi-Usuario
          path: dist/CiviTaxi-Usuario.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CiviTaxi-Chofer
          path: dist/CiviTaxi-Chofer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CiviTaxi-Administrador
          path: dist/CiviTaxi-Administrador.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CiviTaxi-APK-Pack
          path: dist/*.apk
