plugins { id 'com.android.application' }

android {
    namespace 'com.civitaxi.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.novataxi.app'
        minSdk 24
        targetSdk 35
        versionCode 20
        versionName '0.17.0'
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions 'perfil'
    productFlavors {
        usuario {
            dimension 'perfil'
            applicationIdSuffix '.pasajero'
            resValue 'string', 'app_name', 'Nova Taxi Pasajero'
            buildConfigField 'String', 'APP_URL', '"file:///android_asset/index.html"'
        }
        chofer {
            dimension 'perfil'
            applicationIdSuffix '.conductor'
            resValue 'string', 'app_name', 'Nova Taxi Conductor'
            buildConfigField 'String', 'APP_URL', '"file:///android_asset/index.html"'
        }
        admin {
            dimension 'perfil'
            applicationIdSuffix '.administrador'
            resValue 'string', 'app_name', 'Nova Taxi Administrador'
            buildConfigField 'String', 'APP_URL', '"file:///android_asset/index.html"'
        }
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.5'
}
