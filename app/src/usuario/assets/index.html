<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>CiviTaxi Usuario</title></head><body><div class="app"><div class="brand">CiviTaxi</div>
<section id="login" class="screen active"><h2>Usuario</h2><input id="email" class="input" type="email" autocomplete="email" placeholder="Correo"><input id="pass" class="input" type="password" autocomplete="current-password" placeholder="Contraseña"><button class="btn" onclick="userLogin()">INGRESAR</button><button class="btn secondary" onclick="go('register')">CREAR CUENTA</button><p id="loginMsg"></p></section>
<section id="register" class="screen"><h2>Crear cuenta</h2><input id="name" class="input" autocomplete="name" placeholder="Nombre completo"><input id="regEmail" class="input" type="email" autocomplete="email" placeholder="Correo"><input id="regPass" class="input" type="password" autocomplete="new-password" placeholder="Contraseña (mín. 8 caracteres)"><button class="btn" onclick="userRegister()">REGISTRARME</button><button class="btn secondary" onclick="go('login')">VOLVER</button><p id="regMsg"></p></section>
<section id="home" class="screen"><div class="map">📍 → 🏁</div><div class="card"><h2>¿A dónde vamos?</h2><input id="origin" class="input" value="Mi ubicación actual" readonly><input id="destination" class="input" placeholder="Destino, distrito o ciudad"><button class="btn" onclick="prepareTrip()">CALCULAR RUTA</button><button class="btn secondary" onclick="loadMyTrips()">MIS VIAJES</button><button class="btn secondary" onclick="logoutUser()">CERRAR SESIÓN</button><p id="homeMsg"></p></div></section>
<section id="preview" class="screen"><div class="map">📍 ➜ 🏁</div><div class="card"><h2>Confirma tu viaje</h2><p id="previewRoute"></p><p><span id="previewDistance" class="badge"></span><span id="previewTime" class="badge"></span></p><div id="previewFare" class="price"></div><button class="btn" onclick="confirmTrip()">CONFIRMAR Y BUSCAR CHOFER</button><button class="btn secondary" onclick="go('home')">CAMBIAR DESTINO</button><p id="previewMsg"></p></div></section>
<section id="search" class="screen"><div class="map">🔎 🚕</div><div class="card"><h2 id="tripStatus">Buscando chofer...</h2><p id="tripRoute"></p><p id="tripFare"></p><button class="btn secondary" onclick="shareCurrentTrip()">📤 COMPARTIR VIAJE</button><button id="cancelBtn" class="btn secondary" onclick="cancelTrip()">CANCELAR</button><button class="btn secondary" onclick="go('home')">IR AL INICIO</button></div></section>
<section id="history" class="screen"><h2>Mis viajes</h2><div id="historyList"></div><button class="btn secondary" onclick="go('home')">VOLVER</button></section>
</div><script src="api.js"></script><script src="app.js"></script><script>
let currentTrip=null,draftTrip=null,pollTimer=null;
const msg=(id,t)=>document.getElementById(id).textContent=t||'';
async function userLogin(){try{msg('loginMsg','Ingresando...');await Civi.signIn(email.value.trim(),pass.value);msg('loginMsg','');if(!(await resumePassengerTrip()))go('home')}catch(e){msg('loginMsg',e.message)}}
async function userRegister(){try{if((regPass.value||'').length<8)throw new Error('La contraseña debe tener al menos 8 caracteres.');msg('regMsg','Creando y activando tu cuenta...');await Civi.signUp(regEmail.value.trim(),regPass.value,name.value.trim(),'usuario');msg('regMsg','Cuenta creada y activada. Bienvenido a CiviTaxi.');if(!(await resumePassengerTrip()))go('home')}catch(e){msg('regMsg',e.message)}}
async function prepareTrip(){if(!Civi.token()){go('login');return}const dest=destination.value.trim();if(!dest){msg('homeMsg','Ingresa un destino.');return}try{msg('homeMsg','Obteniendo tu ubicación y calculando la ruta...');const p=await currentPosition();const o={lat:p.coords.latitude,lng:p.coords.longitude};const d=await geocodePeru(dest);const route=await routeEstimate(o,d);const fare=estimateFare(route.km,route.min);draftTrip={origin_address:'Mi ubicación actual',origin_lat:o.lat,origin_lng:o.lng,destination_address:d.name,destination_lat:d.lat,destination_lng:d.lng,estimated_distance_km:Number(route.km.toFixed(2)),estimated_duration_min:Math.max(1,Math.round(route.min)),estimated_fare:fare,payment_method:'efectivo'};previewRoute.textContent='📍 Mi ubicación actual → 🏁 '+d.name;previewDistance.textContent=route.km.toFixed(1)+' km';previewTime.textContent=Math.round(route.min)+' min';previewFare.textContent=money(fare);msg('homeMsg','');msg('previewMsg','');go('preview')}catch(e){msg('homeMsg',e.message)}}
async function confirmTrip(){if(!draftTrip)return;try{msg('previewMsg','Buscando un chofer cercano...');const rows=await Civi.createTrip(draftTrip);currentTrip=rows[0];draftTrip=null;renderTrip();go('search');startPolling()}catch(e){msg('previewMsg',e.message)}}
function renderTrip(){if(!currentTrip)return;tripStatus.textContent=String(currentTrip.status||'solicitado').replaceAll('_',' ').toUpperCase();tripRoute.textContent='📍 '+currentTrip.origin_address+' → 🏁 '+currentTrip.destination_address;tripFare.textContent=money(currentTrip.final_fare||currentTrip.estimated_fare);cancelBtn.style.display=['solicitado','aceptado','chofer_en_camino','chofer_llego'].includes(currentTrip.status)?'block':'none'}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(refreshTrip,5000);refreshTrip()}
async function refreshTrip(){if(!currentTrip)return;try{const rows=await Civi.trips('id=eq.'+encodeURIComponent(currentTrip.id)+'&limit=1');if(rows[0]){currentTrip=rows[0];renderTrip();if(['completado','cancelado'].includes(currentTrip.status))clearInterval(pollTimer)}}catch(e){}}
async function resumePassengerTrip(){try{const rows=await Civi.activePassengerTrip();if(!rows[0])return false;currentTrip=rows[0];renderTrip();go('search');startPolling();return true}catch(e){if(!Civi.token())go('login');return false}}
async function cancelTrip(){if(!currentTrip||!['solicitado','aceptado','chofer_en_camino','chofer_llego'].includes(currentTrip.status))return;try{const rows=await Civi.patchTrip(currentTrip.id,{status:'cancelado',cancellation_reason:'Cancelado por usuario'},'passenger_id=eq.'+encodeURIComponent(Civi.userId()));if(rows[0])currentTrip=rows[0];renderTrip();clearInterval(pollTimer)}catch(e){alert(e.message)}}
async function shareCurrentTrip(){if(!currentTrip)return;try{const s=await Civi.createShareToken(currentTrip.id);const token=s&&s.token||(Array.isArray(s)&&s[0]&&s[0].token);if(!token)throw new Error('No se pudo crear el enlace');nativeShare('Sigue mi viaje CiviTaxi: '+SUPABASE_URL+'/functions/v1/share-trip?token='+token)}catch(e){alert(e.message)}}
async function loadMyTrips(){try{const rows=await Civi.trips('passenger_id=eq.'+encodeURIComponent(Civi.userId())+'&limit=30');historyList.innerHTML=rows.map(t=>'<div class="card"><b>'+escapeHTML(String(t.status).replaceAll('_',' ').toUpperCase())+'</b><p>'+escapeHTML(t.origin_address)+' → '+escapeHTML(t.destination_address)+'</p><p>'+money(t.final_fare||t.estimated_fare)+'</p></div>').join('')||'<div class="card">Aún no tienes viajes.</div>';go('history')}catch(e){alert(e.message)}}
function logoutUser(){clearInterval(pollTimer);Civi.signOut();currentTrip=null;go('login')}
if(Civi.token())resumePassengerTrip().then(found=>{if(!found&&Civi.token())go('home')}).catch(()=>go('login'));
</script></body></html>
