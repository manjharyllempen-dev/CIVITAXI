<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>CiviTaxi Chofer</title></head><body><div class="app"><div class="brand">🚕 CiviTaxi Chofer</div>
<section id="login" class="screen active"><h2>Acceso chofer</h2><input id="email" class="input" placeholder="Correo"><input id="pass" class="input" type="password" placeholder="Contraseña"><button class="btn" onclick="driverLogin()">INGRESAR</button><button class="btn secondary" onclick="go('register')">REGISTRARME</button><p id="loginMsg"></p></section>
<section id="register" class="screen"><h2>Registro de chofer</h2><input id="name" class="input" placeholder="Nombre completo"><input id="regEmail" class="input" placeholder="Correo"><input id="regPass" class="input" type="password" placeholder="Contraseña"><input id="dni" class="input" placeholder="DNI"><input id="license" class="input" placeholder="Licencia"><button class="btn" onclick="driverRegister()">ENVIAR REGISTRO</button><button class="btn secondary" onclick="go('login')">VOLVER</button><p id="regMsg"></p></section>
<section id="home" class="screen"><div class="map">🚕</div><div class="card"><h2 id="driverState">Estado del chofer</h2><p id="driverInfo"></p><button id="availBtn" class="btn" onclick="toggleAvailable()">CONECTARME</button><button class="btn secondary" onclick="loadRequests()">BUSCAR SERVICIOS</button><button class="btn secondary" onclick="logoutDriver()">CERRAR SESIÓN</button></div><div id="requestList"></div></section>
<section id="request" class="screen"><div class="map">A ➜ B</div><div class="card"><h2>NUEVO SERVICIO</h2><p><b>📍 ORIGEN</b><br><span id="reqOrigin"></span></p><p><b>🏁 DESTINO</b><br><span id="reqDest"></span></p><span id="reqDistance" class="badge"></span><span id="reqFare" class="badge"></span><div class="row"><button class="btn secondary" onclick="go('home')">RECHAZAR</button><button class="btn" onclick="acceptSelected()">ACEPTAR</button></div></div></section>
<section id="pickup" class="screen"><div class="map">🚕 ➜ 👤</div><div class="card"><b id="pickupOrigin"></b><p id="pickupDest"></p><button class="btn" onclick="tripStep('chofer_en_camino')">IR AL ORIGEN</button><button class="btn" onclick="tripStep('chofer_llego')">LLEGUÉ</button><button class="btn" onclick="tripStep('en_viaje')">INICIAR VIAJE</button></div></section>
<section id="trip" class="screen"><div class="map">🚕 ➜ 🏁</div><div class="card"><h2>Viaje activo</h2><p id="activeDest"></p><button class="btn" onclick="finishTrip()">FINALIZAR VIAJE</button></div></section>
<section id="finish" class="screen"><div class="card"><h2>Viaje terminado</h2><div id="finalFare" class="price"></div><p id="commission"></p><p id="earning"></p><button class="btn" onclick="backHome()">CONFIRMAR COBRO</button></div></section>
</div><script src="api.js"></script><script src="app.js"></script><script>
let driver=null, selectedTrip=null, activeTrip=null, pollTimer=null;
const msg=(id,t)=>document.getElementById(id).textContent=t||'';
async function driverLogin(){try{await Civi.signIn(email.value,pass.value);await initDriver();go('home')}catch(e){msg('loginMsg',e.message)}}
async function driverRegister(){try{const r=await Civi.signUp(regEmail.value,regPass.value,name.value,'chofer');if(r.access_token)localStorage.setItem('sb_token',r.access_token);if(!Civi.token()){msg('regMsg','Cuenta creada. Confirma tu correo e inicia sesión para completar el registro.');return}await Civi.ensureDriver(dni.value,license.value);msg('regMsg','Registro enviado. El administrador debe aprobarte antes de recibir servicios.');await initDriver();go('home')}catch(e){msg('regMsg',e.message)}}
async function initDriver(){const rows=await Civi.driverRecord();driver=rows[0]||null;if(!driver){driverState.textContent='Registro incompleto';driverInfo.textContent='Completa tu registro como chofer.';availBtn.disabled=true;return}driverState.textContent='Estado: '+String(driver.status).toUpperCase();driverInfo.textContent=driver.status==='aprobado'?(driver.is_available?'Estás disponible.':'Estás desconectado.'):'Esperando revisión del administrador.';availBtn.disabled=driver.status!=='aprobado';availBtn.textContent=driver.is_available?'DESCONECTARME':'CONECTARME';if(driver.status==='aprobado'&&driver.is_available)startRequestPolling()}
async function toggleAvailable(){try{const next=!driver.is_available;const rows=await Civi.available(next);driver=rows[0]||driver;await initDriver();if(next)loadRequests();else{clearInterval(pollTimer);requestList.innerHTML=''}}catch(e){alert(e.message)}}
function startRequestPolling(){clearInterval(pollTimer);pollTimer=setInterval(loadRequests,6000);loadRequests()}
async function loadRequests(){if(!driver||driver.status!=='aprobado'||!driver.is_available){requestList.innerHTML='<div class="card">Debes estar aprobado y conectado para recibir servicios.</div>';return}try{const rows=await Civi.requestedTrips();requestList.innerHTML=rows.map(t=>'<div class="card"><b>📍 '+t.origin_address+'</b><p>🏁 '+t.destination_address+'</p><span class="badge">'+Number(t.estimated_distance_km||0).toFixed(1)+' km</span><span class="badge">'+money(t.estimated_fare)+'</span><button class="btn" onclick="openRequest(\''+t.id+'\')">VER SERVICIO</button></div>').join('')||'<div class="card">No hay solicitudes nuevas por ahora.</div>';window._requests=rows}catch(e){requestList.innerHTML='<div class="card">'+e.message+'</div>'}}
function openRequest(id){selectedTrip=(window._requests||[]).find(t=>t.id===id);if(!selectedTrip)return;reqOrigin.textContent=selectedTrip.origin_address;reqDest.textContent=selectedTrip.destination_address;reqDistance.textContent=Number(selectedTrip.estimated_distance_km||0).toFixed(1)+' km';reqFare.textContent=money(selectedTrip.estimated_fare);go('request')}
async function acceptSelected(){if(!selectedTrip)return;try{const rows=await Civi.acceptTrip(selectedTrip.id);if(!rows.length){alert('Otro chofer aceptó este servicio primero.');go('home');loadRequests();return}activeTrip=rows[0];clearInterval(pollTimer);pickupOrigin.textContent='Recoger en '+activeTrip.origin_address;pickupDest.textContent='Destino: '+activeTrip.destination_address;go('pickup')}catch(e){alert(e.message)}}
async function tripStep(status){if(!activeTrip)return;try{const rows=await Civi.patchTrip(activeTrip.id,{status});if(rows[0])activeTrip=rows[0];if(status==='en_viaje'){activeDest.textContent='Destino: '+activeTrip.destination_address;go('trip')}}catch(e){alert(e.message)}}
async function finishTrip(){if(!activeTrip)return;try{const fare=Number(activeTrip.estimated_fare||0);const rows=await Civi.patchTrip(activeTrip.id,{status:'completado',completed_at:new Date().toISOString(),final_fare:fare});if(rows[0])activeTrip=rows[0];finalFare.textContent=money(fare);const c=fare*.15;commission.textContent='Comisión CiviTaxi: '+money(c);earning.textContent='Ganancia: '+money(fare-c);go('finish')}catch(e){alert(e.message)}}
function backHome(){activeTrip=null;go('home');initDriver()}
function logoutDriver(){Civi.signOut();clearInterval(pollTimer);go('login')}
if(Civi.token()){initDriver().then(()=>go('home')).catch(()=>go('login'))}
</script></body></html>
