<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>CiviTaxi Usuario</title></head><body><div class="app"><div class="brand">🚕 CiviTaxi</div>
<section id="login" class="screen active"><h2>Usuario</h2><input id="email" class="input" placeholder="Correo"><input id="pass" class="input" type="password" placeholder="Contraseña"><button class="btn" onclick="userLogin()">INGRESAR</button><button class="btn secondary" onclick="go('register')">CREAR CUENTA</button><p id="loginMsg"></p></section>
<section id="register" class="screen"><h2>Crear cuenta</h2><input id="name" class="input" placeholder="Nombre completo"><input id="regEmail" class="input" placeholder="Correo"><input id="regPass" class="input" type="password" placeholder="Contraseña (mín. 6 caracteres)"><button class="btn" onclick="userRegister()">REGISTRARME</button><button class="btn secondary" onclick="go('login')">VOLVER</button><p id="regMsg"></p></section>
<section id="home" class="screen"><div class="map">📍 → 🏁</div><div class="card"><h2>¿A dónde vamos?</h2><input id="origin" class="input" value="Mi ubicación"><input id="destination" class="input" placeholder="Destino"><input id="fare" class="input" type="number" step="0.50" value="8" placeholder="Tarifa estimada"><button class="btn" onclick="requestTrip()">SOLICITAR VIAJE</button><button class="btn secondary" onclick="loadMyTrips()">MIS VIAJES</button><p id="homeMsg"></p></div></section>
<section id="search" class="screen"><div class="map">🔎 🚕</div><div class="card"><h2 id="tripStatus">Buscando chofer...</h2><p id="tripRoute"></p><p id="tripFare"></p><button class="btn secondary" onclick="shareCurrentTrip()">📤 COMPARTIR VIAJE</button><button class="btn secondary" onclick="cancelTrip()">CANCELAR</button></div></section>
<section id="history" class="screen"><h2>Mis viajes</h2><div id="historyList"></div><button class="btn secondary" onclick="go('home')">VOLVER</button></section>
</div><script src="api.js"></script><script src="app.js"></script><script>
let currentTrip=null, pollTimer=null;
const msg=(id,t)=>document.getElementById(id).textContent=t||'';
async function userLogin(){try{await Civi.signIn(email.value,pass.value);go('home')}catch(e){msg('loginMsg',e.message)}}
async function userRegister(){try{const r=await Civi.signUp(regEmail.value,regPass.value,name.value,'usuario');msg('regMsg',r.access_token?'Cuenta creada. Ya puedes usar CiviTaxi.':'Cuenta creada. Revisa tu correo si Supabase solicita confirmación.');if(r.access_token){localStorage.setItem('sb_token',r.access_token);go('home')}}catch(e){msg('regMsg',e.message)}}
async function requestTrip(){if(!Civi.token()){go('login');return}const dest=destination.value.trim();if(!dest){msg('homeMsg','Ingresa un destino.');return}try{const rows=await Civi.createTrip({origin_address:origin.value||'Mi ubicación',origin_lat:-12.0464,origin_lng:-77.0428,destination_address:dest,destination_lat:-12.0500,destination_lng:-77.0300,estimated_distance_km:3.2,estimated_duration_min:12,estimated_fare:Number(fare.value||8),payment_method:'efectivo'});currentTrip=rows[0];renderTrip();go('search');startPolling()}catch(e){msg('homeMsg',e.message)}}
function renderTrip(){if(!currentTrip)return;tripStatus.textContent=String(currentTrip.status||'solicitado').replaceAll('_',' ').toUpperCase();tripRoute.textContent='📍 '+currentTrip.origin_address+' → 🏁 '+currentTrip.destination_address;tripFare.textContent=money(currentTrip.final_fare||currentTrip.estimated_fare)}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(refreshTrip,5000);refreshTrip()}
async function refreshTrip(){if(!currentTrip)return;try{const rows=await Civi.trips('id=eq.'+encodeURIComponent(currentTrip.id)+'&limit=1');if(rows[0]){currentTrip=rows[0];renderTrip();if(['completado','cancelado'].includes(currentTrip.status))clearInterval(pollTimer)}}catch(e){}}
async function cancelTrip(){if(!currentTrip)return;try{const rows=await Civi.patchTrip(currentTrip.id,{status:'cancelado',cancellation_reason:'Cancelado por usuario'},'passenger_id=eq.'+encodeURIComponent(Civi.userId()));if(rows[0])currentTrip=rows[0];renderTrip();clearInterval(pollTimer)}catch(e){alert(e.message)}}
async function shareCurrentTrip(){if(!currentTrip)return;try{const s=await Civi.createShareToken(currentTrip.id);const token=s.token||(Array.isArray(s)&&s[0]&&s[0].token);if(!token)throw new Error('No se pudo crear el enlace');nativeShare('Sigue mi viaje CiviTaxi: '+SUPABASE_URL+'/functions/v1/share-trip?token='+token)}catch(e){alert(e.message)}}
async function loadMyTrips(){try{const rows=await Civi.trips('passenger_id=eq.'+encodeURIComponent(Civi.userId())+'&limit=30');historyList.innerHTML=rows.map(t=>'<div class="card"><b>'+String(t.status).replaceAll('_',' ').toUpperCase()+'</b><p>'+t.origin_address+' → '+t.destination_address+'</p><p>'+money(t.final_fare||t.estimated_fare)+'</p></div>').join('')||'<div class="card">Aún no tienes viajes.</div>';go('history')}catch(e){alert(e.message)}}
if(Civi.token())go('home');
</script></body></html>
