<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>CiviTaxi Administrador</title></head><body><div class="app"><div class="brand">🚕 CiviTaxi Admin</div>
<section id="login" class="screen active"><h2>Administrador</h2><input id="email" class="input" placeholder="Correo" value="civitaxi2024@gmail.com"><input id="pass" class="input" type="password" placeholder="Contraseña"><button class="btn" onclick="adminLogin()">INGRESAR</button><button class="btn secondary" onclick="go('register')">CREAR CUENTA ADMIN</button><p id="loginMsg"></p></section>
<section id="register" class="screen"><h2>Crear cuenta administrador</h2><p>La cuenta principal autorizada es <b>civitaxi2024@gmail.com</b>.</p><input id="regName" class="input" placeholder="Nombre del administrador"><input id="regEmail" class="input" placeholder="Correo" value="civitaxi2024@gmail.com"><input id="regPass" class="input" type="password" placeholder="Crea una contraseña"><button class="btn" onclick="adminRegister()">CREAR CUENTA</button><button class="btn secondary" onclick="go('login')">VOLVER</button><p id="regMsg"></p></section>
<section id="biometric" class="screen"><div class="card"><h2>🔐 Acceso protegido</h2><p>Usa tu huella o biometría para abrir CiviTaxi Administrador.</p><button class="btn" onclick="startBiometric()">USAR HUELLA / BIOMETRÍA</button><button class="btn secondary" onclick="disableBiometricAndLogin()">USAR CORREO Y CONTRASEÑA</button><p id="bioMsg"></p></div></section>
<section id="home" class="screen"><h2>Dashboard</h2><div class="row"><div class="card"><b id="driverCount">0</b><p>Choferes</p></div><div class="card"><b id="pendingCount">0</b><p>Pendientes</p></div></div><div class="row"><div class="card"><b id="activeCount">0</b><p>Viajes activos</p></div><div class="card"><b id="completedCount">0</b><p>Finalizados</p></div></div><button class="btn" onclick="loadDrivers()">GESTIONAR CHOFERES</button><button class="btn secondary" onclick="loadTrips()">VER VIAJES</button><button id="bioEnableBtn" class="btn secondary" onclick="enableBiometric()">ACTIVAR HUELLA / BIOMETRÍA</button><button class="btn secondary" onclick="logoutAdmin()">CERRAR SESIÓN</button></section>
<section id="drivers" class="screen"><h2>Choferes</h2><div id="driversList"></div><button class="btn secondary" onclick="go('home')">VOLVER</button></section>
<section id="trips" class="screen"><h2>Viajes</h2><div id="tripsList"></div><button class="btn secondary" onclick="go('home')">VOLVER</button></section>
</div><script src="api.js"></script><script src="app.js"></script><script>
const msg=(id,t)=>document.getElementById(id).textContent=t||'';
const BOOTSTRAP_ADMIN='civitaxi2024@gmail.com';
let biometricAction='unlock';
function hasNativeBiometric(){try{return !!(window.Android&&Android.biometricAvailable&&Android.biometricAvailable())}catch(e){return false}}
async function requireAdmin(){const rows=await Civi.profile();if(!rows[0]||rows[0].role!=='admin'){Civi.signOut();throw new Error('Esta cuenta no tiene permisos de administrador.')}return rows[0]}
async function adminLogin(){try{msg('loginMsg','Ingresando...');await Civi.signIn(email.value.trim(),pass.value);await requireAdmin();await refreshDashboard();msg('loginMsg','');go('home');updateBioButton()}catch(e){msg('loginMsg',e.message)}}
async function adminRegister(){try{const mail=regEmail.value.trim().toLowerCase();if(mail!==BOOTSTRAP_ADMIN){throw new Error('Por seguridad, la primera cuenta administradora debe usar '+BOOTSTRAP_ADMIN)}if((regPass.value||'').length<8)throw new Error('La contraseña debe tener al menos 8 caracteres.');msg('regMsg','Creando cuenta...');const r=await Civi.signUp(mail,regPass.value,regName.value.trim(),'admin');if(r.access_token){localStorage.setItem('sb_token',r.access_token);if(r.refresh_token)localStorage.setItem('sb_refresh',r.refresh_token);await requireAdmin();await refreshDashboard();msg('regMsg','Cuenta administradora creada.');go('home');updateBioButton()}else{msg('regMsg','Cuenta creada. Revisa el correo para confirmar la cuenta y luego inicia sesión.') }}catch(e){msg('regMsg',e.message)}}
async function refreshDashboard(){const [drivers,trips]=await Promise.all([Civi.drivers(),Civi.trips('limit=200')]);driverCount.textContent=drivers.length;pendingCount.textContent=drivers.filter(d=>d.status==='pendiente').length;activeCount.textContent=trips.filter(t=>!['completado','cancelado'].includes(t.status)).length;completedCount.textContent=trips.filter(t=>t.status==='completado').length}
async function loadDrivers(){try{const rows=await Civi.drivers();driversList.innerHTML=rows.map(d=>'<div class="card"><b>'+d.document_number+' · '+String(d.status).toUpperCase()+'</b><p>Licencia: '+d.license_number+' · ⭐ '+Number(d.rating||0).toFixed(1)+'</p><div class="row"><button class="btn secondary" onclick="setDriverStatus(\''+d.id+'\',\'rechazado\')">RECHAZAR</button><button class="btn" onclick="setDriverStatus(\''+d.id+'\',\'aprobado\')">APROBAR</button></div></div>').join('')||'<div class="card">Sin choferes registrados.</div>';go('drivers')}catch(e){alert(e.message)}}
async function setDriverStatus(id,status){try{await Civi.patchDriver(id,{status,approved_at:status==='aprobado'?new Date().toISOString():null,is_available:false});await loadDrivers();await refreshDashboard()}catch(e){alert(e.message)}}
async function loadTrips(){try{const rows=await Civi.trips('limit=100');tripsList.innerHTML=rows.map(t=>'<div class="card"><b>'+String(t.status).replaceAll('_',' ').toUpperCase()+'</b><p>'+t.origin_address+' → '+t.destination_address+'</p><p>'+money(t.final_fare||t.estimated_fare)+' · '+new Date(t.requested_at).toLocaleString()+'</p></div>').join('')||'<div class="card">No hay viajes todavía.</div>';go('trips')}catch(e){alert(e.message)}}
function updateBioButton(){if(!hasNativeBiometric()){bioEnableBtn.style.display='none';return}bioEnableBtn.style.display='block';bioEnableBtn.textContent=localStorage.getItem('admin_bio')==='1'?'DESACTIVAR HUELLA / BIOMETRÍA':'ACTIVAR HUELLA / BIOMETRÍA'}
function enableBiometric(){if(localStorage.getItem('admin_bio')==='1'){localStorage.removeItem('admin_bio');updateBioButton();return}if(!hasNativeBiometric()){alert('Este dispositivo no tiene biometría disponible o configurada.');return}biometricAction='enable';msg('bioMsg','');Android.authenticateBiometric()}
function startBiometric(){if(!hasNativeBiometric()){msg('bioMsg','Biometría no disponible. Usa correo y contraseña.');return}biometricAction='unlock';msg('bioMsg','Verificando...');Android.authenticateBiometric()}
window.onBiometricResult=async function(ok,message){msg('bioMsg',message||'');if(!ok)return;if(biometricAction==='enable'){localStorage.setItem('admin_bio','1');updateBioButton();alert('Huella/biometría activada para este dispositivo.');return}try{await requireAdmin();await refreshDashboard();go('home');updateBioButton()}catch(e){Civi.signOut();localStorage.removeItem('admin_bio');msg('loginMsg','La sesión expiró. Ingresa nuevamente.');go('login')}}
function disableBiometricAndLogin(){localStorage.removeItem('admin_bio');Civi.signOut();go('login')}
function logoutAdmin(){Civi.signOut();go('login')}
if(Civi.token()){
  if(localStorage.getItem('admin_bio')==='1'&&hasNativeBiometric()){go('biometric');setTimeout(startBiometric,350)}
  else{requireAdmin().then(()=>refreshDashboard()).then(()=>{go('home');updateBioButton()}).catch(()=>go('login'))}
}
</script></body></html>
