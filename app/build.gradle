plugins { id 'com.android.application' }

android {
    namespace 'com.civitaxi.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.civitaxi.app'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '0.5.1'
    }

    flavorDimensions 'perfil'
    productFlavors {
        usuario { dimension 'perfil'; applicationIdSuffix '.usuario'; resValue 'string', 'app_name', 'CiviTaxi Usuario' }
        chofer { dimension 'perfil'; applicationIdSuffix '.chofer'; resValue 'string', 'app_name', 'CiviTaxi Chofer' }
        admin { dimension 'perfil'; applicationIdSuffix '.admin'; resValue 'string', 'app_name', 'CiviTaxi Administrador' }
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.5'
}
