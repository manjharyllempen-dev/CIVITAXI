<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>CiviTaxi Usuario</title></head><body><div class="app"><div class="brand">🚕 CiviTaxi</div><section id="login" class="screen active"><h2>Usuario</h2><input id="email" class="input" placeholder="Correo"><input id="pass" class="input" type="password" placeholder="Contraseña"><button class="btn" onclick="login('email','pass','home')">INGRESAR</button><button class="btn secondary" onclick="go('home')">MODO PRUEBA</button></section><section id="home" class="screen"><div class="map">📍 → 🏁</div><div class="card"><h2>¿A dónde vamos?</h2><input class="input" value="Mi ubicación"><input class="input" placeholder="Destino"><button class="btn" onclick="go('confirm')">CONTINUAR</button></div></section><section id="confirm" class="screen"><div class="card"><b>📍 Av. Principal 123</b><p>🏁 Plaza de Armas</p><span class="badge">3.2 km</span><span class="badge">12 min</span><div class="price">S/ 8.00</div><button class="btn" onclick="go('search')">SOLICITAR VIAJE</button></div></section><section id="search" class="screen"><div class="map">🔎 🚕</div><div class="card"><h2>Buscando chofer...</h2><button class="btn" onclick="go('trip')">SIMULAR CHOFER ENCONTRADO</button></div></section><section id="trip" class="screen"><div class="map">🚕 ➜ 🏁</div><div class="card"><b>Juan R. · ⭐ 4.8 · ABC-123</b><p>Destino: Plaza de Armas</p><button class="btn secondary" onclick="nativeShare('CiviTaxi: estoy en viaje hacia Plaza de Armas. Seguimiento temporal de prueba.')">📤 COMPARTIR VIAJE</button><button class="btn" onclick="go('finish')">FINALIZAR</button></div></section><section id="finish" class="screen"><div class="card"><h2>✅ Viaje finalizado</h2><div class="price">S/ 8.00</div><p>★★★★★</p><button class="btn" onclick="go('home')">VOLVER AL INICIO</button></div></section></div><script src="api.js"></script><script src="app.js"></script></body></html>
