name: Build Nova Taxi APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar tres APK
        run: gradle :app:assembleUsuarioDebug :app:assembleChoferDebug :app:assembleAdminDebug
      - name: Preparar APK para descargar y compartir
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/usuario/debug/*.apk dist/NovaTaxi-Pasajero.apk
          cp app/build/outputs/apk/chofer/debug/*.apk dist/NovaTaxi-Conductor.apk
          cp app/build/outputs/apk/admin/debug/*.apk dist/NovaTaxi-Administrador.apk
          cd dist
          sha256sum NovaTaxi-Pasajero.apk NovaTaxi-Conductor.apk NovaTaxi-Administrador.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NovaTaxi-Pasajero
          path: dist/NovaTaxi-Pasajero.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NovaTaxi-Conductor
          path: dist/NovaTaxi-Conductor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NovaTaxi-Administrador
          path: dist/NovaTaxi-Administrador.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NovaTaxi-APK-Pack
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
