name: Build CiviTaxi APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build three debug APKs
        run: gradle :app:assembleUsuarioDebug :app:assembleChoferDebug :app:assembleAdminDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CiviTaxi-Usuario
          path: app/build/outputs/apk/usuario/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CiviTaxi-Chofer
          path: app/build/outputs/apk/chofer/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CiviTaxi-Administrador
          path: app/build/outputs/apk/admin/debug/*.apk

